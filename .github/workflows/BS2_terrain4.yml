name: BS2 Four-Way Terrain Review
on:
  push:
    branches: [codex/bs2-terrain4-review-20261011]
  workflow_dispatch:
jobs:
  shader:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - uses: microsoft/setup-msbuild@v2
      - run: ./tools/terrain4/build-dll.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: bs2-terrain4-shader
          path: sp/game/mod_episodic/bin/game_shader_dx9.dll
          if-no-files-found: error
